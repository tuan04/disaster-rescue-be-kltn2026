name: Build Social Collector image

on:
  push:
    branches: [chore/setup-staging]
    paths:
      - '.github/workflows/deploy-social-collector.yml'
      - 'core-service/social-collector/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Social Collector
        uses: docker/build-push-action@v7
        with:
          context: ./core-service/social-collector
          file: ./core-service/social-collector/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/social-collector:sha-${{ github.sha }}
          cache-from: type=gha,scope=social-collector
          cache-to: type=gha,mode=max,scope=social-collector
