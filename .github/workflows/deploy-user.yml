name: Build User image

on:
  push:
    branches: [chore/setup-staging]
    paths:
      - '.github/workflows/deploy-user.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pom.xml'
      - 'core-service/*/pom.xml'
      - 'infrastructure/*/pom.xml'
      - 'core-service/common-lib/src/main/**'
      - 'core-service/user-service/src/main/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push User
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: MODULE=core-service/user-service
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/user-service:sha-${{ github.sha }}
          cache-from: type=gha,scope=user-service
          cache-to: type=gha,mode=max,scope=user-service
