syntax = "proto3";
package iuh.fit.common.grpc;

option java_package = "iuh.fit.common.grpc";
option java_multiple_files = true;


service integration_service{
  rpc GetCCCDInfoFromImage (CCCDImageGrpcRequest) returns (CCCDImageGrpcResponse);
}

message CCCDImageGrpcRequest {
  bytes image_data = 1;
  string file_name = 2;
}

message CCCDImageGrpcResponse {
  string CCCDNumber = 1;
  string fullName = 2;
  string birthDay = 3;
  string gender = 4;
  string address = 5;
}