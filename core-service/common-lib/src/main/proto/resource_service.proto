syntax = "proto3";
package iuh.fit.common.grpc;

option java_package = "iuh.fit.common.grpc";
option java_multiple_files = true;

service ResourceTeamGrpcService {
    rpc GetTeamByLeaderId (GetTeamByLeaderRequest) returns (TeamInfoResponse);
    rpc IsLeaderOfTeam (IsLeaderOfTeamRequest) returns (IsLeaderOfTeamResponse);
    rpc GetNotificationRecipientsByTeamIds (GetNotificationRecipientsByTeamIdsRequest)
        returns (GetNotificationRecipientsByTeamIdsResponse);
}

message GetTeamByLeaderRequest {
    string leader_id = 1;
}

message TeamInfoResponse {
    string campaign_team_id = 1;
    string team_name = 2;
    string leader_phone = 3;
}

message IsLeaderOfTeamRequest {
    string leader_id = 1;
    string team_id = 2;
}

message IsLeaderOfTeamResponse {
    bool is_leader = 1;
}

message GetNotificationRecipientsByTeamIdsRequest {
    repeated string team_ids = 1;
}

message TeamNotificationRecipients {
    string team_id = 1;
    repeated string user_ids = 2;
    bool team_exists = 3;
}

message GetNotificationRecipientsByTeamIdsResponse {
    repeated TeamNotificationRecipients teams = 1;
}