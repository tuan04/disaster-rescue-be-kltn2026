syntax = "proto3";
package iuh.fit.common.grpc;

option java_package = "iuh.fit.common.grpc";
option java_multiple_files = true;

service UserGrpcService {
    rpc GetUsersByIds (GetUsersByIdsRequest) returns (GetUsersByIdsResponse);
    rpc GetUserById (GetUserByIdRequest) returns (UserInfoGrpcResponse);
    rpc GetNotificationUserIds (GetNotificationUserIdsRequest)
        returns (GetNotificationUserIdsResponse);
}

message GetUsersByIdsRequest {
    repeated string user_ids = 1;
}

message GetUsersByIdsResponse {
    repeated UserInfoGrpcResponse users = 1;
}

message GetUserByIdRequest {
    string user_id = 1;
}

message UserInfoGrpcResponse {
    string id = 1;
    string full_name = 2;
    string phone_number = 3;
    string role = 4;
    string avatar_url = 5;
    string sex = 6;
}


message GetNotificationUserIdsRequest {
    int32 page = 1;
    int32 size = 2;
}

message GetNotificationUserIdsResponse {
    repeated string user_ids = 1;
    bool has_next = 2;
}