server:
  port: 8000

spring:
  cloud:
    gateway:
      globals:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/auth/**
            - id: dispatch-service
              uri: lb://dispatch-service
              predicates:
                - Path=/api/v1/dispatches/**
            - id: resource-management-service
              uri: lb://resource-management-service
              predicates:
                - Path=/api/v1/resources/**
            - id: integration-service
              uri: lb://integration-ai-service
              predicates:
                - Path=/api/v1/ai/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
