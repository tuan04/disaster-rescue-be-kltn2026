server:
  port: 8085

spring:
  grpc:
    server:
      port: 9095
      max-inbound-message-size: 6MB
  mongodb:
    uri: ${MONGO_INTEGRATION_URI}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: 1s
  ai:
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}
        chat:
          model: ${GOOGLE_AI_MODEL}
        embedding:
          api-key: ${GOOGLE_AI_API_KEY}
          text:
            model: ${GOOGLE_EMBEDDING_MODEL}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    #      properties:
    #        spring.json.add.type.headers: true
    #        spring.json.type.mapping: >
    #          sos_event:iuh.fit.dispatchservice.dtos.response.RescueDetailResponse
    consumer:
      group-id: integration-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        #         spring.json.use.type.headers: true
        spring.json.trusted.packages: "iuh.fit.common.kafka.dto"
        #         spring.json.type.mapping: >
        #           sos_event:iuh.fit.dispatchservice.dtos.response.RescueDetailResponse

weather:
  api:
    key: ${WEATHER_API_KEY}
    base-url: ${WEATHER_API_BASE_URL:https://api.weatherapi.com/v1}
    forecast-days: ${WEATHER_FORECAST_DAYS:3}

goong:
  api-key: ${GOONG_API_KEY:}
  base-url: ${GOONG_BASE_URL:https://rsapi.goong.io}

n8n:
  webhook:
    secret-key: ${N8N_WEBHOOK_SECRET_KEY}

social:
  jobs:
    # Nghỉ 5 giây sau mỗi lượt xét duyệt.
    approval-delay-ms: 5000

    # Nghỉ 2 giây sau mỗi lượt gửi outbox.
    publish-delay-ms: 2000

    # Chờ 10 giây trước lần chạy đầu tiên.
    initial-delay-ms: 10000

rsa:
  # Cùng public key xác minh token do user-service ký.
  public-key-path: ${RSA_PUBLIC_PATH}

sms:
  webhook:
    # Khóa dành riêng cho hệ thống gửi SMS vào integration-service.
    # Nếu chưa cấu hình, code bên dưới sẽ từ chối webhook SMS.
    secret-key: ${SMS_WEBHOOK_SECRET_KEY}
