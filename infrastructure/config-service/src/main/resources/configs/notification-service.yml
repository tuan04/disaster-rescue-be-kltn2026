server:
  port: 8084

spring:
  grpc:
    client:
      channel:
        resource-management-service:
          target: static://${RESOURCE_GRPC_HOST:localhost}:${RESOURCE_GRPC_PORT:9092}
          negotiation-type: plaintext
        user-service:
          target: static://${USER_GRPC_HOST:localhost}:${USER_GRPC_PORT:9091}
          negotiation-type: plaintext
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${NOTIFICATION_DB_NAME:notification_db}?currentSchema=${NOTIFICATION_DB_SCHEMA:${DB_SCHEMA:public}},public
    username: ${NOTIFICATION_DB_USER:${DB_USER:postgres}}
    password: ${NOTIFICATION_DB_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        #        spring.json.use.type.headers: true
        spring.json.trusted.packages: "iuh.fit.common.kafka.dto"
        #        spring.json.type.mapping: >
        #          sos_event:iuh.fit.notificationservice.dtos.RescueDetailResponse

rsa:
  # Public key tương ứng với private key user-service dùng để ký JWT.
  public-key-path: ${RSA_PUBLIC_PATH}
