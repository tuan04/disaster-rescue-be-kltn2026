server:
  port: 8081

spring:
  grpc:
    server:
      port: 9091
    client:
      channel:
        integration-service:
          target: static://${INTEGRATION_GRPC_HOST:localhost}:${INTEGRATION_GRPC_PORT:9095}
          negotiation-type: plaintext
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${USER_DB_NAME:user_db}?currentSchema=${USER_DB_SCHEMA:${DB_SCHEMA:public}},public
    username: ${USER_DB_USER:${DB_USER:postgres}}
    password: ${USER_DB_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9094}
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "iuh.fit.common.kafka.dto"

app:
  security:
    cookie-secure: ${COOKIE_SECURE:false}

rsa:
  private-key-path: ${RSA_PRIVATE_PATH}
  public-key-path: ${RSA_PUBLIC_PATH}

aws:
  s3:
    bucket-name: ${BUCKET_NAME}
    region: ${REGION}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

sms:
  macrodroid:
    webhook-url: ${MACRODROID_WEBHOOK_URL:}